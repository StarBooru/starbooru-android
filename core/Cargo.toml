[package]
name = "starbooru-android-core"
description = "The Rust core of StarBooru for Android, reached from Kotlin through UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "starbooru_android_core"
crate-type = ["cdylib", "lib"]

# Generates the Kotlin bindings: cargo run --features bindgen --bin uniffi-bindgen
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
starbooru-core = { git = "https://github.com/StarBooru/starbooru-server", tag = "v0.7.1" }
starbooru-client = { git = "https://github.com/StarBooru/starbooru-server", tag = "v0.7.1" }
uniffi = { version = "0.33", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "net"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
